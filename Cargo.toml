[package]
name = "LBProxy"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "dashboard"
path = "src/dashboard/main.rs"

[[bin]]
name = "lb-service"
path = "src/service/main.rs"

[patch.crates-io]
hyper = { git = 'https://github.com/PonderForge/hyper.git' }

[dependencies]
openlb = { version = "0.1.2", default-features = false, features = ["bincode", "image_scan", "human_scan"] }
hyper = { version = "1.8.1", features = ["http1", "http2", "server", "client"] }
clap = { version = "4.4.16", features = ["derive"] }
tokio = { version = "1.34.0", features = [ "macros", "rt", "rt-multi-thread" ] }
rcgen = { version = "0.13.1", features = ["x509-parser"] }
ndarray = "0.16"
http-body-util = "0.1.0"
bytes = "1.5.0"
dirs-next = "2.0.0"
windows-registry = "0.5.0"
flate2 = "1.0.34"
slint = { version = "1.10.0", default-features=false, features = ["backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
tracing = "0.1.40"
sysinfo = "0.34.1"
bincode = "2.0.1"
ort = { version = "=2.0.0-rc.8", default-features=false, features = ["load-dynamic", "half", "ndarray"] }
auto-launch = "0.5.0"
ftail = "0.2.1"
ctrlc = { version = "3.4.6", features = ["termination"] }
rev_buf_reader = "0.3.0"
http-mitm-proxy = "0.14.0"
log = "0.4.27"
windows = { version = "0.58.0", features = ["Win32_Security_Cryptography"] }
image = { version = "0.25.8"}

[target.'cfg(target_os = "windows")'.dependencies]
duct = "1.1.1"

[build-dependencies]
winresource = "0.1.17"
slint-build = "1.10.0"

[profile.dev]
opt-level = 1
