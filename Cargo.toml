[package]
name = "LBProxy"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "dashboard"
path = "src/dashboard/main.rs"

[[bin]]
name = "lb-service"
path = "src/service/main.rs"

[dependencies]
openlb = { path = "../openlb", features = ["bincode"] }
clap = { version = "4.4.16", features = ["derive"] }
tokio = { version = "1.34.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "parking_lot",
    "io-util",
    "net",
] }
hyper = { version = "1.0.1", features = ["http1", "http2", "server", "client"] }
rcgen = { version = "0.13.1", features = ["x509-parser"] }
ndarray = "0.16"
http-body-util = "0.1.0"
bytes = "1.5.0"
rand = "0.8.5"
dirs-next = "2.0.0"
windows-registry = "0.5.0"
opencv = { version = "0.93.4", default-features = false , features = ["imgcodecs", "imgproc", "dnn"] }
yaml-rust2 = "0.9"
flate2 = "1.0.34"
slint = {version = "1.10.0"}
tracing = "0.1.40"
sysinfo = "0.34.1"
bincode = "2.0.1"
ort = { version = "=2.0.0-rc.8", features = ["cuda", "load-dynamic", "tensorrt"] }
auto-launch = "0.5.0"
ftail = "0.2.1"
ctrlc = { version = "3.4.6", features = ["termination"] }
rev_buf_reader = "0.3.0"
http-mitm-proxy = "0.14.0"
log = "0.4.27"
windows = { version = "0.58.0", features = ["Win32_Security_Cryptography"] }

[build-dependencies]
winresource = "0.1.17"
slint-build = "1.10.0"
